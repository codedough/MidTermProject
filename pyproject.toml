[project]
name = "produce-shortage-warning"
version = "1.0.0"
description = "Early warning of fresh-produce shortages 1-3 months ahead, served as a web service"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy==2.5.3",
    "pandas==3.0.5",
    "scikit-learn==1.9.1",
    "xgboost-cpu>=3.4,<4",
    "fastapi>=0.119",
    "uvicorn>=0.38",
]

[project.optional-dependencies]
notebook = [
    "matplotlib>=3.10",
    "ipykernel",
    "jupyterlab",
    "nbconvert",
    "nbformat",
]
